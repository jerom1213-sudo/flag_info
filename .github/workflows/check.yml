name: Portable app checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: npm run doctor
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: event-finder-${{ matrix.os }}
          path: release/the-flag-event-finder.zip
